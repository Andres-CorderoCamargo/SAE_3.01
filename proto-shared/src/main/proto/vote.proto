syntax = "proto3";

package vote;

option java_package = "com.g3.vote.proto";
option java_multiple_files = true;


message LoginRequest {
  string login = 1;
  bytes password_hash = 2;
}

// token : vide si echec. role vaut ELECTEUR, ORGANISATEUR ou SCRUTATEUR.
// doit_changer_mdp est vrai a la premiere connexion.
message LoginResponse {
  bool success = 1;
  string token = 2;
  string role = 3;
  bool doit_changer_mdp = 4;
  string message = 5;
}


message PublicKeyRequest {}

message PublicKeyResponse {
  string public_key = 1;
}


message VoteRequest {
  string session_token = 1;
  bytes vote_chiffre = 2;
}

message VoteResponse {
  bool success = 1;
  string message = 2;
  bool is_late = 3;
}


message ResultRequest {}

message ResultResponse {
  bool election_terminee = 1;
  string resultat = 2;
  string message = 3;
}


// Un seul chiffre : l'agregat de tous les bulletins, jamais les bulletins un par un.
message AggregatedResultToScrutateur {
  bytes agregat_u = 1;
  bytes agregat_v = 2;
  int32 nombre_bulletins = 3; // borne B pour la recherche exhaustive de m
}

message DecryptedResultFromScrutateur {
  bool success = 1;
  int32 nombre_de_oui = 2;
  string message = 3;
}


// Reserve a l'organisateur : le serveur refuse si le token n'est pas le sien.
message AjouterElecteurRequest {
  string session_token = 1;
  string electeur_id = 2;  // 5 caracteres maximum
  string login = 3;
  bytes password_hash = 4;
  string nom = 5;
  string prenom = 6;
}

message AjouterElecteurResponse {
  bool success = 1;
  string message = 2;
}


message ClientMessage {
  reserved 2; // ancien register_request : l'electeur ne s'inscrit plus lui-meme

  oneof payload {
    PublicKeyRequest public_key_request = 1;
    VoteRequest vote_request = 3;
    ResultRequest result_request = 4;
    LoginRequest login_request = 5;
    AjouterElecteurRequest ajouter_electeur_request = 6;
  }
}
