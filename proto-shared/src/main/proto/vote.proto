syntax = "proto3";

package vote;

option java_package = "com.g3.vote.proto";
option java_multiple_files = true;


message PublicKeyRequest {}

message PublicKeyResponse {
  string public_key = 1;
}


message VoteRequest {
  reserved 2;  // ancien vote_chiffre : un seul bloc, incompatible avec ElGamal

  string electeur_id = 1;
  string referendum_id = 3;
  bytes bulletin_u = 4;   // g^r
  bytes bulletin_v = 5;   // h^r * g^vote
}

message VoteResponse {
  bool success = 1;
  string message = 2;
  bool is_late = 3;
}


message ResultRequest {}

message ResultResponse {
  bool election_terminee = 1;
  string resultat = 2;
  string message = 3;
}


// Un seul chiffre : l'agregat de tous les bulletins, jamais les bulletins un par un.
message AggregatedResultToScrutateur {
  bytes agregat_u = 1;
  bytes agregat_v = 2;
  int32 nombre_bulletins = 3; // borne B pour la recherche exhaustive de m
}

message DecryptedResultFromScrutateur {
  bool success = 1;
  int32 nombre_de_oui = 2;
  string message = 3;
}


message RegisterRequest {
  string electeur_id = 1;
  string login = 2;
  //pas chiffree a ce moment
  bytes password_chiffre = 3;
  string nom = 4 ;
  string prenom = 5;
  string jeton_session = 6;
}

message RegisterResponse {
  bool success = 1;
  string message = 2;
}


message ClientMessage {
  oneof payload {
    PublicKeyRequest public_key_request = 1;
    RegisterRequest register_request = 2;
    VoteRequest vote_request = 3;
    ResultRequest result_request = 4;
    DeleteElecteurRequest delete_electeur_request = 5;
    UpdateElecteurRequest update_electeur_request = 6;
    LoginRequest login_request = 7;
    InscrireElecteurRequest inscrire_electeur_request = 8;
    LancerReferendumRequest lancer_referendum_request = 9;
    CloturerReferendumRequest cloturer_referendum_request = 10;
  }
}


message DeleteElecteurRequest {
  string electeur_id = 1;
  string jeton_session = 2;
}

message DeleteElecteurResponse {
  bool success = 1;
  string message = 2;
}

message UpdateElecteurRequest {
  string electeur_id = 1;
  string login = 2;
  string nom = 3;
  string prenom = 4;
  string jeton_session = 5;
}
message UpdateElecteurResponse {
  bool success = 1;
  string message = 2;
}

message LoginRequest {
  string login = 1;
  string mot_de_passe = 2;   // en clair : le hachage se fait cote serveur
}

message LoginResponse {
  bool success = 1;
  string message = 2;
  string jeton_session = 3;
  string role = 4;            // ELECTEUR, ORGANISATEUR ou SCRUTATEUR
  bool doit_changer_mdp = 5;
}
message InscrireElecteurRequest {
  string referendum_id = 1;
  string electeur_id = 2;
  string jeton_session = 3;
}

message InscrireElecteurResponse {
  bool success = 1;
  string message = 2;
}
message LancerReferendumRequest {
  string referendum_id = 1;
  string jeton_session = 2;
}

message LancerReferendumResponse {
  bool success = 1;
  string message = 2;
}

message CloturerReferendumRequest {
  string referendum_id = 1;
  string jeton_session = 2;
}

message CloturerReferendumResponse {
  bool success = 1;
  string message = 2;
}
