# Base Oracle LOCALE pour tester sans l'acces a la base de l'IUT.
# Lancement : docker compose up -d   (dans ce dossier)
# Le dossier BD/ est monte dans le conteneur sous /bd (lecture seule).
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: sae-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: sys_local          # mot de passe de SYS (inutile pour nous)
      APP_USER: sae                       # le compte que le serveur Java utilisera
      APP_USER_PASSWORD: sae_local
    volumes:
      - ../:/bd:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
